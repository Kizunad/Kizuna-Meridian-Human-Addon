pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
}

// 相邻仓库位置、产物路径与第三方版本都由 Framework 的工作区脚本提供（kizunaWorkspace、libs）。
apply from: new File(rootDir.parentFile, 'Kizuna-Meridian-Mod-Framework/scripts/workspace.gradle')

rootProject.name = 'kizuna-meridian-human-addon'
include 'shared', 'client', 'server', 'fabric'

// 框架尚未发布 Maven 产物；开发时从独立仓库源码组合，不复制它的源码或协议。local.meridian 是本地替换键。
kizunaWorkspace.includeSource('framework', [client: 'local.meridian:client', server: 'local.meridian:server'])
// 功法库、玩家动画、Damage 与库存 UI 服务端都按真实坐标声明依赖，
// 所以替换键用各工程自身的 group 与工程名；登记后完整装配按同一组件装入，不再另读同名 JAR。
kizunaWorkspace.includeSource('technique', [
        fabric: 'dev.kizuna.meridian.technique:fabric',
        server: 'dev.kizuna.meridian.technique:server',
        shared: 'dev.kizuna.meridian.technique:shared'
])
kizunaWorkspace.includeSource('players-animation', ['': 'dev.kizuna:kizuna-players-animation'])
kizunaWorkspace.includeSource('vanilla-damage', [
        fabric: 'dev.kizuna.meridian.vanilla:fabric',
        server: 'dev.kizuna.meridian.vanilla:server'
])
// 本构建直接组合 Inventory UI，嵌套的 Progression、Items 不再登记它的替换规则，所以两个模块都要列出。
kizunaWorkspace.includeSource('inventory-ui', [
        '': 'dev.kizuna.inventoryui:kizuna-inventory-ui-framework',
        server: 'dev.kizuna.inventoryui:server'
])
kizunaWorkspace.includeSource('progression', [
        server: 'dev.kizuna.meridian.progression:server',
        shared: 'dev.kizuna.meridian.progression:shared',
        fabric: 'dev.kizuna.meridian.progression:fabric',
        client: 'dev.kizuna.meridian.progression:client'
])
