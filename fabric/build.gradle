plugins {
    id 'fabric-loom'
}

description = '人体内容的 Minecraft 玩家适配；身体结算仍调用经脉框架。'

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.wispforest.io/releases' }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.20.1'
    mappings 'net.fabricmc:yarn:1.20.1+build.10:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.16.10'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.3+1.20.1'
    modImplementation files('../../Kizuna-Players-Animation/build/libs/kizuna-players-animation-0.1.0-SNAPSHOT.jar')
    modImplementation files('../../Kizuna-Meridian-Progression-Addon/fabric/build/libs/kizuna-meridian-progression-addon-fabric-0.1.0-SNAPSHOT.jar')
    modImplementation files('../../Kizuna-Inventory-UI-Framework/server/build/libs/kizuna-inventory-ui-framework-server-0.1.0-SNAPSHOT.jar')
    implementation files('../../Kizuna-Meridian-Progression-Addon/shared/build/libs/kizuna-meridian-progression-addon-shared-0.1.0-SNAPSHOT.jar',
            '../../Kizuna-Meridian-Progression-Addon/server/build/libs/kizuna-meridian-progression-addon-server-0.1.0-SNAPSHOT.jar')
    implementation project(':server')
    implementation 'local.meridian.technique:server'
    def techniqueDirectory = rootProject.file(providers.gradleProperty('meridianTechniqueDir')
            .getOrElse('../Kizuna-Meridian-Technique-Framework'))
    modImplementation files(new File(techniqueDirectory,
            'fabric/build/libs/kizuna-meridian-technique-framework-fabric-0.1.0-SNAPSHOT.jar'))
    // 人体资源包的编译期协议已由下方服务端库提供，避免 Loom 再解析一份客户端协议副本。
    modImplementation(project(':client')) { transitive = false }
    // 独立安装产物携带其实际运行依赖；源码与 Protobuf 仍只从各自仓库构建。
    include project(':server')
    include project(':shared')
    include project(':client')
    include implementation('local.meridian:server')
    include implementation('com.google.protobuf:protobuf-java:4.36.2')
    include implementation('org.tomlj:tomlj:1.1.1')
    include implementation('org.antlr:antlr4-runtime:4.11.1')
    testImplementation 'junit:junit:4.13.2'
}

test { useJUnit() }
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

apply from: '../../Kizuna-Meridian-Mod-Framework/scripts/full-assembly.gradle'

loom {
    mods {
        meridian_human { sourceSet sourceSets.main }
    }
    runs {
        client {
            runDir 'build/playtest'
            programArgs '--width', '1440', '--height', '1000'
        }
        server {
            runDir 'build/server'
        }
    }
}

// 在真实 Minecraft 服务端运行玩家身体宿主；测试入口不进入发布产物。
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}
loom {
    mods {
        meridian_human_test { sourceSet sourceSets.gametest }
    }
    runs {
        gametest {
            server()
            name 'Human GameTest'
            source sourceSets.gametest
            runDir 'build/gametest'
            vmArg '-Dfabric-api.gametest'
            vmArg '-Dfabric-api.gametest.report-file=build/gametest-results.xml'
        }
    }
}
