plugins {
    id 'net.fabricmc.fabric-loom'
}

description = '人体内容的 Minecraft 玩家适配；身体结算仍调用经脉框架。'

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.wispforest.io/releases' }
}

dependencies {
    // 26.x 不混淆：直接用官方名编译，没有映射，模组依赖也不经重映射。
    minecraft libs.minecraft
    implementation libs.fabric.loader
    implementation libs.fabric.api
    // /meridian 指令统一注册点（Framework 的 Fabric 模组 meridian_framework），Framework 组合时自动替换为源码工程。
    implementation 'dev.kizuna.meridian:fabric'
    // 玩家动画、Damage、库存 UI 服务端、功法库与成长附属在 settings 中以源码组合，依赖处写替换坐标。
    implementation 'dev.kizuna:kizuna-players-animation'
    implementation 'dev.kizuna.meridian.vanilla:fabric'
    implementation 'dev.kizuna.inventoryui:server'
    implementation 'dev.kizuna.meridian.technique:fabric'
    implementation 'dev.kizuna.meridian.technique:server'
    // 与原先读单个 JAR 一致只取成长附属的模块本身，其传递库由完整装配在运行时按同一组件补齐。
    implementation('dev.kizuna.meridian.progression:fabric') { transitive = false }
    implementation('dev.kizuna.meridian.progression:shared') { transitive = false }
    implementation('dev.kizuna.meridian.progression:server') { transitive = false }
    implementation project(':server')
    // 人体资源包的编译期协议已由下方服务端库提供，避免 Loom 再解析一份客户端协议副本。
    implementation(project(':client')) { transitive = false }
    // 独立安装产物携带其实际运行依赖；源码与 Protobuf 仍只从各自仓库构建。
    include project(':server')
    include project(':shared')
    include project(':client')
    include implementation('local.meridian:server')
    // 版本目录条目是 Provider，implementation 不返回依赖对象，嵌套声明单独写。
    implementation libs.protobuf.java
    include libs.protobuf.java
    implementation libs.tomlj
    include libs.tomlj
    implementation libs.antlr.runtime
    include libs.antlr.runtime
    testImplementation libs.junit4
}

test { useJUnit() }
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

// 破门斩等高层附属只在运行时需要，由完整装配按清单读文件，避免本构建反过来组合高层仓库。
apply from: new File(kizunaWorkspace.directory('framework'), 'scripts/full-assembly.gradle')

loom {
    mods {
        meridian_human { sourceSet sourceSets.main }
    }
    runs {
        client {
            runDir 'build/playtest'
            programArgs '--width', '1440', '--height', '1000'
        }
        server {
            runDir 'build/server'
        }
    }
}

// 在真实 Minecraft 服务端运行玩家身体宿主；测试入口不进入发布产物。
def humanGametestDirectory = providers.gradleProperty('humanGametestRunDir')
        .getOrElse("build/gametest-${System.currentTimeMillis()}")
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}
dependencies {
    // 登录假玩家夹具来自功法库的 testFixtures，与功法 fabric 同经源码组合解析。
    gametestImplementation testFixtures('dev.kizuna.meridian.technique:fabric')
}
loom {
    mods {
        meridian_human_test { sourceSet sourceSets.gametest }
    }
    runs {
        gametest {
            server()
            name 'Human GameTest'
            source sourceSets.gametest
            runDir humanGametestDirectory
            vmArg '-Dfabric-api.gametest'
            vmArg '-Dfabric-api.gametest.report-file=build/gametest-results.xml'
        }
        spawnProtection {
            server()
            name 'Human Dedicated Spawn Protection Test'
            source sourceSets.gametest
            runDir 'build/spawn-protection'
            vmArg '-Dmeridian.human.spawnProtectionTest=true'
        }
    }
}

tasks.named('runSpawnProtection') {
    doFirst {
        // 每局新建世界，人体存档与假玩家不跨运行累积。
        // 平坦世界必须写明地层：默认的空 generator-settings 解析失败，会在日志里留 DFU 错误再退回预设。
        def runDirectory = file('build/spawn-protection')
        new File(runDirectory, 'world').deleteDir()
        runDirectory.mkdirs()
        new File(runDirectory, 'eula.txt').text = 'eula=true\n'
        new File(runDirectory, 'server.properties').text = '''online-mode=false
server-ip=127.0.0.1
server-port=0
spawn-protection=16
level-type=minecraft:flat
generator-settings={"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains"}
generate-structures=false
view-distance=2
simulation-distance=2
'''
        new File(runDirectory, 'result.txt').text = ''
    }
    doLast {
        if (file('build/spawn-protection/result.txt').text.trim() != 'PASS') {
            throw new GradleException('出生点保护专用服务端验证未通过')
        }
    }
}
