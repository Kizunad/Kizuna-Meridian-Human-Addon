plugins {
    id 'fabric-loom'
}

description = '人体内容的 Minecraft 玩家适配；身体结算仍调用经脉框架。'

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.wispforest.io/releases' }
}

dependencies {
    minecraft libs.minecraft
    mappings "net.fabricmc:yarn:${libs.versions.yarn.get()}:v2"
    modImplementation libs.fabric.loader
    modImplementation libs.fabric.api
    // 玩家动画、Damage、库存 UI 服务端与功法库在 settings 中以源码组合，依赖处写替换坐标。
    modImplementation 'dev.kizuna:kizuna-players-animation'
    modImplementation 'dev.kizuna.meridian.vanilla:fabric'
    modImplementation 'dev.kizuna.inventoryui:server'
    modImplementation 'dev.kizuna.meridian.technique:fabric'
    implementation 'dev.kizuna.meridian.technique:server'
    // 成长附属仍由 Loom 1.6 构建，与本构建的 Loom 版本不同就无法组合；它升级前按装配清单读安装产物。
    modImplementation files(kizunaWorkspace.artifact('progression', 'fabric', false))
    implementation files(kizunaWorkspace.artifact('progression', 'shared', false),
            kizunaWorkspace.artifact('progression', 'server', false))
    implementation project(':server')
    // 人体资源包的编译期协议已由下方服务端库提供，避免 Loom 再解析一份客户端协议副本。
    modImplementation(project(':client')) { transitive = false }
    // 独立安装产物携带其实际运行依赖；源码与 Protobuf 仍只从各自仓库构建。
    include project(':server')
    include project(':shared')
    include project(':client')
    include implementation('local.meridian:server')
    // 版本目录条目是 Provider，implementation 不返回依赖对象，嵌套声明单独写。
    implementation libs.protobuf.java
    include libs.protobuf.java
    implementation libs.tomlj
    include libs.tomlj
    implementation libs.antlr.runtime
    include libs.antlr.runtime
    testImplementation libs.junit4
}

test { useJUnit() }
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

// Loom 只按坐标复用 modprocessing 里的嵌套 JAR，SNAPSHOT 坐标不变时会把旧 server/shared JAR 打进发布 JAR；
// 每次打发布 JAR 前清掉该缓存，让 include 的 JAR 按当前产物重新生成。
def clearNestedJarCache = tasks.register('clearNestedJarCache', Delete) {
    delete layout.buildDirectory.dir('loom-cache/temp/modprocessing')
}
tasks.named('remapJar') {
    dependsOn clearNestedJarCache
}

// 破门斩等高层附属只在运行时需要，由完整装配按清单读文件，避免本构建反过来组合高层仓库。
apply from: new File(kizunaWorkspace.directory('framework'), 'scripts/full-assembly.gradle')

loom {
    mods {
        meridian_human { sourceSet sourceSets.main }
    }
    runs {
        client {
            runDir 'build/playtest'
            programArgs '--width', '1440', '--height', '1000'
        }
        server {
            runDir 'build/server'
        }
    }
}

// 在真实 Minecraft 服务端运行玩家身体宿主；测试入口不进入发布产物。
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}
loom {
    mods {
        meridian_human_test { sourceSet sourceSets.gametest }
    }
    runs {
        gametest {
            server()
            name 'Human GameTest'
            source sourceSets.gametest
            runDir 'build/gametest'
            vmArg '-Dfabric-api.gametest'
            vmArg '-Dfabric-api.gametest.report-file=build/gametest-results.xml'
        }
        spawnProtection {
            server()
            name 'Human Dedicated Spawn Protection Test'
            source sourceSets.gametest
            runDir 'build/spawn-protection'
            vmArg '-Dmeridian.human.spawnProtectionTest=true'
        }
    }
}

tasks.named('runSpawnProtection') {
    doFirst {
        def runDirectory = file('build/spawn-protection')
        runDirectory.mkdirs()
        new File(runDirectory, 'eula.txt').text = 'eula=true\n'
        new File(runDirectory, 'server.properties').text = '''online-mode=false
server-ip=127.0.0.1
server-port=0
spawn-protection=16
level-type=minecraft:flat
generate-structures=false
view-distance=2
simulation-distance=2
'''
        new File(runDirectory, 'result.txt').text = ''
    }
    doLast {
        if (file('build/spawn-protection/result.txt').text.trim() != 'PASS') {
            throw new GradleException('出生点保护专用服务端验证未通过')
        }
    }
}
