# 中焦周天的服务端可调项。改配置后重启服务端。两项都只管真炁及以上境界；游炁的周天不受影响
# （每圈增益固定 0.2、封顶 0.099、整批循环不补料）。真炁以后和游炁一样，周天运转时八脉不参与自然扩散。
# 两项都是占位值，等试玩再调。

# 每圈的提纯增益：密度每圈提高的数量级，再乘自动或冲关效率，越接近 0.1 越慢。
# 炼到 0.1 的那份就是气态：每圈结束时卸进这一圈的终点经脉，再从八脉里游离态最多的那条补料，把这批补回 10 元。
# 1.3 时自动周天（效率 0.5）2 圈炼完一批（10 元一批约 32 秒），冲关满 4 次一圈就炼完。自动周天每跑约 60 秒
# 就按脑耐力歇一次，续上时还要先等已有运输抵达，增益 1.0 要 3 圈（约 45 秒），多数批次炼不完就被退回。
# 损耗按实际增量算，炼完一批剩约 22%，其余回环境。要写成大于 0 的小数。
true_qi_density_gain = 1.3

# 一批货的起炼下限（元）。八脉里游离态最多的那条连同这批没炼完的零头凑不够这个数，周天就停下，
# 提示「八脉里没有可炼的游离态，周天停下」。要写成大于 0、不超过 10 的小数。
true_qi_min_batch = 0.1
