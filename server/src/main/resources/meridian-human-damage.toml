# 部位系数绑定身体模板；改配置后重启服务端，已有身体同样使用新规则。
[entities]
default_enabled = true
"minecraft:player" = true
"minecraft:villager" = true
"minecraft:wandering_trader" = true
"minecraft:pillager" = true
"minecraft:vindicator" = true
"minecraft:evoker" = true
"minecraft:witch" = true
"minecraft:illusioner" = true

[templates."human:adult"]
# 改造新增部位没有单独条目时采用此值，仍按其实际上限 HP 参与接收。
default_multiplier = 1.0

[templates."human:adult".parts]
head = 1.0
neck = 1.0
chest = 1.0
abdomen = 1.5
pelvis = 1.0
left_upper_arm = 0.7
right_upper_arm = 0.7
left_forearm = 0.7
right_forearm = 0.7
left_hand = 0.7
right_hand = 0.7
left_thigh = 1.0
right_thigh = 1.0
left_lower_leg = 1.0
right_lower_leg = 1.0
left_foot = 1.0
right_foot = 1.0

# 没绑身体的目标（原版生物）没有肌肉可麻：挨了带「麻」的一下，改给原版的缓慢和虚弱。
# ticks 是持续多久（20 tick 一秒）；两个等级从 1 起算，写 0 表示那一样不给。
[bodiless_numb]
ticks = 60
slowness_level = 1
weakness_level = 1
