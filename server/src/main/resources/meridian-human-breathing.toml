# 人体吐纳的产物相态。改配置后重启服务端；已在经脉里的真元不受影响。
# 身体到真炁及以上境界时，吐纳炼出的真元里直接成为气态（密度 0.1）的份额，其余仍是游离态（密度 0.01）。
# 0 表示只出游离态（与游炁一样），1 表示全部出气态。占位值，等试玩再调。
# 心经、肾经只炼气态：份额越低，同样吐纳时长攒到心、肾的气态越少。
# 经脉里留着的游离态一直占容，新气态要把它往前推，离肺经最远的肾经到得最慢。
true_qi_gas_share = 1.0

# 吐纳炼出的真元里留成本属性的份额：吸的是火行灵气，这一份就直接是火行真元，其余是无属性。总量不变。
# 留下的本属性真元当场记进本行开着的经（火进心经、小肠经，金进肺经、大肠经，以此类推），
# 本行的经一条都没开、或者都装满了，这一份照旧算成无属性。0 表示全是无属性（和以前一样）。
native_share = 0.25
