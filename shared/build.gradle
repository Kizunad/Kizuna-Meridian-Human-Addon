apply plugin: 'com.google.protobuf'
description = '人体修炼的跨端 Protobuf 契约。'
// protoc 与运行库同版本，取版本目录中的 protobuf-java。
protobuf { protoc { artifact = "com.google.protobuf:protoc:${libs.versions.protobuf.java.get()}" } }
dependencies {
    api libs.protobuf.java
    api 'local.meridian:client'
    api 'dev.kizuna.meridian.technique:shared'
}

def descriptor = layout.buildDirectory.file('descriptors/human-v1.desc')
protobuf {
    generateProtoTasks {
        ofSourceSet('main').configureEach { task ->
            task.generateDescriptorSet = true
            task.descriptorSetOptions.path = descriptor.get().asFile.path
            task.descriptorSetOptions.includeImports = true
            task.descriptorSetOptions.includeSourceInfo = true
        }
    }
}

processResources {
    dependsOn tasks.named('generateProto')
    from(descriptor) { into 'META-INF/meridian_human/protocol' }
}

tasks.register('protocolZip', Zip) {
    dependsOn tasks.named('generateProto')
    archiveClassifier = 'proto'
    from('src/main/proto')
    from(descriptor) { into 'descriptors' }
    from(rootProject.files('LICENSE', 'NOTICE'))
}

tasks.named('assemble') { dependsOn tasks.named('protocolZip') }
