plugins {
    id 'base'
    alias(libs.plugins.fabric.loom) apply false
    alias(libs.plugins.protobuf) apply false
}

allprojects {
    group = 'dev.kizuna.meridian.human'
    version = '0.1.0-SNAPSHOT'
}

subprojects {
    apply plugin: 'java-library'

    repositories {
        mavenCentral()
    }
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(libs.versions.java.get())
        }
    }
    base.archivesName = "${rootProject.name}-${project.name}"
    tasks.withType(JavaCompile).configureEach {
        options.release = libs.versions.java.get().toInteger()
        options.encoding = 'UTF-8'
    }
    tasks.withType(JavaExec).configureEach {
        // 导出和演示也使用版本目录指定的 Java，不能依赖开发机默认 JDK 的额外能力。
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(libs.versions.java.get())
        }
    }
    tasks.withType(Jar).configureEach {
        // 各产物保留许可；fabric 安装包另外通过 Loom include 装配所需的原始依赖 JAR。
        from(rootProject.files('LICENSE', 'NOTICE', 'THIRD_PARTY_NOTICES.md'))
    }
}

tasks.named('assemble') {
    dependsOn ':client:assemble', ':server:assemble', ':fabric:assemble'
}
tasks.named('check') {
    dependsOn ':client:check', ':server:check', ':fabric:check'
}
tasks.named('clean') {
    dependsOn ':client:clean', ':server:clean', ':fabric:clean'
}
tasks.register('test') {
    group = 'verification'
    dependsOn ':client:test', ':server:test', ':fabric:test'
}
tasks.register('demo') {
    group = 'application'
    description = '通过真实 Protobuf 命令演示一轮人体聚气。'
    dependsOn ':server:demo'
}
